<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Ilustración: personas tocando música juntas">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2CB8D"/>
      <stop offset="1" stop-color="#F3F0DD"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#73B193"/>
      <stop offset="1" stop-color="#5c9a7d"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="800" height="800" fill="url(#sky)"/>

  <!-- Sol / círculo cálido -->
  <circle cx="580" cy="240" r="120" fill="#E07A5F" opacity="0.9"/>
  <circle cx="580" cy="240" r="120" fill="none" stroke="#F3F0DD" stroke-width="6" opacity="0.5"/>

  <!-- Colina orgánica -->
  <path d="M0,560 C160,470 300,540 420,540 C560,540 680,470 800,520 L800,800 L0,800 Z" fill="url(#hill)"/>
  <path d="M0,640 C180,590 340,660 520,630 C660,608 740,650 800,634 L800,800 L0,800 Z" fill="#383A5B" opacity="0.9"/>

  <!-- Figuras simples tocando música (siluetas) -->
  <g fill="#383A5B">
    <!-- Persona 1 con guitarra -->
    <circle cx="300" cy="470" r="34"/>
    <path d="M270,510 q30,-24 60,0 l6,80 q-36,16 -72,0 Z"/>
    <ellipse cx="345" cy="560" rx="34" ry="24" transform="rotate(-18 345 560)" fill="#E07A5F"/>
    <rect x="352" y="500" width="10" height="70" rx="5" transform="rotate(-18 357 535)" fill="#E07A5F"/>
  </g>
  <g fill="#2b2e31">
    <!-- Persona 2 cantando -->
    <circle cx="470" cy="480" r="30"/>
    <path d="M444,516 q26,-20 52,0 l6,70 q-32,14 -64,0 Z"/>
  </g>

  <!-- Notas musicales flotando -->
  <g fill="#383A5B">
    <g transform="translate(200,180)">
      <ellipse cx="0" cy="40" rx="16" ry="12" transform="rotate(-20 0 40)"/>
      <rect x="13" y="-10" width="6" height="48" rx="3"/>
    </g>
    <g transform="translate(430,140)" fill="#E07A5F">
      <ellipse cx="0" cy="40" rx="13" ry="10" transform="rotate(-20 0 40)"/>
      <rect x="10" y="-2" width="5" height="44" rx="2.5"/>
    </g>
    <g transform="translate(640,420)" fill="#383A5B">
      <ellipse cx="0" cy="40" rx="14" ry="11" transform="rotate(-20 0 40)"/>
      <rect x="11" y="-4" width="5" height="46" rx="2.5"/>
    </g>
  </g>

  <!-- Marca de placeholder (discreta) -->
  <text x="400" y="770" text-anchor="middle" font-family="Jost, sans-serif" font-size="22" fill="#383A5B" opacity="0.55">SolBemol · imagen del hero (placeholder)</text>
</svg>
